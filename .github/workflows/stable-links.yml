name: Release installers

# Runs when an app release is published (or by hand for an existing one:
# Actions → "Release installers" → Run workflow → branch main, tag e.g. v1.2.0).
#
# 1) Installer names: Tauri names the files "Flow.Downloader_<version>_<arch>…";
#    they're renamed to the app's pattern:
#      FlowDownloader-<version>.exe                      Windows
#      FlowDownloader-<version>-macOS-AppleSilicon.dmg   Mac (Apple chip)
#      FlowDownloader-<version>-macOS-Intel.dmg          Mac (Intel)
#      FlowDownloader-<version>-Linux.AppImage / .deb / .rpm
#    (+ the macOS update bundles "….app.tar.gz" and every ".sig"), and
#    latest.json — what the app's auto-update reads — is rewritten with the
#    new names, so updates keep working.
# 2) The README's download buttons and table are moved to this version's files
#    (commit on main), so they always download the latest release directly.
#
# The wallpaper pack release ("wallpapers") is ignored. Running it again on the
# same release is harmless (already renamed files are left as they are).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  installers:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Rename the installers (+ latest.json)
        run: |
          case "$TAG" in v*) ;; *) echo "Not an app release: $TAG"; exit 0 ;; esac
          V="${TAG#v}"
          P="FlowDownloader-${V}"

          # Tauri's name → the app's name (null = leave it).
          new_name() {
            local n="$1" sig=""
            case "$n" in *.sig) sig=".sig"; n="${n%.sig}" ;; esac
            case "$n" in
              *_x64-setup.exe)          echo "${P}.exe${sig}" ;;
              *_aarch64.dmg)            echo "${P}-macOS-AppleSilicon.dmg${sig}" ;;
              *_x64.dmg)                echo "${P}-macOS-Intel.dmg${sig}" ;;
              *_aarch64.app.tar.gz)     echo "${P}-macOS-AppleSilicon.app.tar.gz${sig}" ;;
              *_x64.app.tar.gz)         echo "${P}-macOS-Intel.app.tar.gz${sig}" ;;
              *_amd64.AppImage)         echo "${P}-Linux.AppImage${sig}" ;;
              *_amd64.deb)              echo "${P}-Linux.deb${sig}" ;;
              *.x86_64.rpm)             echo "${P}-Linux.rpm${sig}" ;;
              *) echo "" ;;
            esac
          }

          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id)\t\(.name)"' > assets.tsv
          echo '{}' > renames.json
          while IFS=$'\t' read -r id name; do
            new="$(new_name "$name")"
            [ -n "$new" ] && [ "$new" != "$name" ] || continue
            # A file already called that (e.g. uploaded by hand) gives way to the built one.
            old_id=$(awk -F'\t' -v n="$new" '$2 == n { print $1 }' assets.tsv)
            if [ -n "$old_id" ]; then
              echo "replacing the existing $new"
              gh api -X DELETE "repos/$REPO/releases/assets/$old_id"
            fi
            echo "rename: $name -> $new"
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" > /dev/null
            jq --arg o "$name" --arg n "$new" '. + {($o): $n}' renames.json > r.tmp && mv r.tmp renames.json
          done < assets.tsv

          # latest.json: every URL whose file was renamed points to the new name.
          if grep -q $'\tlatest.json$' assets.tsv && [ "$(jq length renames.json)" -gt 0 ]; then
            gh release download "$TAG" -R "$REPO" -p latest.json --clobber
            jq --slurpfile m renames.json '
              .platforms |= with_entries(
                (.value.url | split("/") | last) as $f
                | if ($m[0][$f] // null) != null then .value.url |= sub("[^/]+$"; $m[0][$f]) else . end)' \
              latest.json > latest.fixed.json
            mv latest.fixed.json latest.json
            cat latest.json
            gh release upload "$TAG" latest.json --clobber -R "$REPO"
          fi

      # The README's download buttons and table link to this release's files
      # by name ("…/releases/download/v1.2.0/FlowDownloader-1.2.0.exe"): the
      # version in them is moved to the new one and committed to main.
      - name: Checkout main (README)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Point the README's download links at this version
        run: |
          case "$TAG" in v*) ;; *) exit 0 ;; esac
          V="${TAG#v}"
          sed -i -E \
            -e "s#releases/download/v[0-9][0-9A-Za-z.+-]*/#releases/download/v${V}/#g" \
            -e "s#FlowDownloader-[0-9][0-9A-Za-z.+]*(\.exe|-macOS|-Linux)#FlowDownloader-${V}\1#g" \
            README.md
          if git diff --quiet README.md; then
            echo "README already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: download links for $TAG"
          git push origin HEAD:main
