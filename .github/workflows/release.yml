name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Create the draft release once, so every build can upload to the same
  # release (no race, no duplicate drafts). Reuses an existing draft for the
  # same tag if the workflow is re-run.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create (or reuse) the draft release
        id: create-release
        uses: actions/github-script@v8
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.APP_VERSION}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: `Flow Downloader ${tag}`,
                draft: true,
                prerelease: false,
              })).data;
            }
            return release.id;

  # One build per platform: Windows (x64), macOS (Apple Silicon + Intel) and
  # Linux (x64: .AppImage for any distro, .deb, .rpm).
  # Each target uses its own platform-specific sidecars (ytdlp/ffmpeg/deno).
  #
  # App auto-update: when the TAURI_SIGNING_PRIVATE_KEY secret exists, the builds
  # are signed and tauri-action adds every platform to the release's
  # latest.json, which the app's updater reads. Builds run one at a time so the
  # jobs don't overwrite each other's latest.json entries.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Ubuntu 22.04 (older glibc) so the Linux build runs on more distros.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The sidecars are committed from Windows, which doesn't record the Unix
      # "executable" permission in git. Tauri copies them into the .app as-is,
      # so without this step yt-dlp/ffmpeg/deno can't be started on macOS.
      - name: Make macOS sidecars executable
        if: runner.os == 'macOS'
        run: |
          chmod +x src-tauri/ytdlp-*-apple-darwin src-tauri/ffmpeg-*-apple-darwin src-tauri/deno-*-apple-darwin
          ls -l src-tauri/*-apple-darwin

      # Linux: system libraries for Tauri (WebKitGTK…), for the screen capture
      # used by the eyedropper / "Print" (xcap: X11, PipeWire, Wayland) and the
      # GStreamer plugins the AppImage bundles for the video wallpapers.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev xz-utils unzip \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # Linux sidecars aren't committed (large): downloaded for each build.
      - name: Download Linux sidecars
        if: runner.os == 'Linux'
        run: bash scripts/fetch-linux-sidecars.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Flow Downloader (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Updater artifacts (.sig + latest.json) only when the signing key exists.
          args: --target ${{ matrix.target }} ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
